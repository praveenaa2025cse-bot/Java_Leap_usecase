<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sewer Grid - Login</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        body { justify-content: center; align-items: center; background-color: var(--primary); }
        .login-box { background: white; padding: 40px; border-radius: 8px; width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .login-box h2 { margin-bottom: 20px; color: var(--primary); text-align: center; }
        .error-msg { color: var(--danger); display: none; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Sewer Grid Auth</h2>
        <div class="error-msg" id="errorMsg">Invalid credentials</div>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; margin-top: 10px;">Login</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            const data = await res.json();
            if(data.success) {
                localStorage.setItem('role', data.role);
                window.location.href = '/dashboard.html';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        });
    </script>
</body>
</html>
